<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <radialGradient id="pulse">
      <stop offset=".0" stop-color="#c5eeff" stop-opacity="1">
        <animate attributeName="stop-color" values="#c5eeff;#d2c2ff;#a4eff4;#c5eeff" dur="6.4s" repeatCount="indefinite" />
      </stop>
      <stop offset=".33" stop-color="#70a6ec" stop-opacity="1">
        <animate attributeName="stop-color" values="#70a6ec;#a884fa;#61cfdc;#70a6ec" dur="6.4s" repeatCount="indefinite" />
      </stop>
      <stop offset=".72" stop-color="#70a6ec" stop-opacity=".66">
        <animate attributeName="stop-color" values="#70a6ec;#a884fa;#61cfdc;#70a6ec" dur="6.4s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#7a8ae8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Local light follows the refractions in the matching fixed background. -->
