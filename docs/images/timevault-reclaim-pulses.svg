    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.13;.82;1" dur="6.3s" begin="-3.1s" repeatCount="indefinite" />
    <ellipse cx="-25" rx="235" ry="64" fill="url(#pulse)" />
  </g>
  <g>
    <animateMotion path="M 742 886 C 981 863 1280 839 1453 829 S 1636 812 1731 791" dur="6.8s" begin="-4.3s" rotate="auto" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.13;.82;1" dur="6.8s" begin="-4.3s" repeatCount="indefinite" />
