<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <radialGradient id="pulse">
      <stop offset=".0" stop-color="#c2f9ff" stop-opacity="1">
        <animate attributeName="stop-color" values="#c2f9ff;#88b9ff;#9fefdc;#c2f9ff" dur="6.4s" repeatCount="indefinite" />
      </stop>
      <stop offset=".33" stop-color="#38d9ff" stop-opacity="1">
        <animate attributeName="stop-color" values="#38d9ff;#668bff;#42d9cc;#38d9ff" dur="6.4s" repeatCount="indefinite" />
      </stop>
      <stop offset=".72" stop-color="#38d9ff" stop-opacity=".66">
        <animate attributeName="stop-color" values="#38d9ff;#668bff;#42d9cc;#38d9ff" dur="6.4s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#7a8ae8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Local light follows the refractions in the matching fixed background. -->
  <g>
    <animateMotion path="M 768 143 C 1030 97 1185 84 1315 92 S 1560 44 1740 -30" dur="5.7s" begin="-1.8s" rotate="auto" repeatCount="indefinite" />
