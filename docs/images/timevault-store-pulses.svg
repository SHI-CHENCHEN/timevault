<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <defs>
    <radialGradient id="pulse">
      <stop stop-color="#dab9ff" />
      <stop offset=".28" stop-color="#925cf7">
        <animate attributeName="stop-color" values="#b374ff;#e05fbc;#8689ff;#b374ff" dur="3.8s" repeatCount="indefinite" />
      </stop>
      <stop offset=".68" stop-color="#925cf7" stop-opacity=".7">
        <animate attributeName="stop-color" values="#b374ff;#e05fbc;#8689ff;#b374ff" dur="3.8s" repeatCount="indefinite" />
      </stop>
      <stop offset="1" stop-color="#925cf7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glint">
      <stop stop-color="#f2deff" />
      <stop offset=".42" stop-color="#f2deff" stop-opacity=".7" />
      <stop offset="1" stop-color="#f2deff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Local light follows the refractions in the matching fixed background. -->
  <g>
    <animateMotion path="M 790 -40 C 1024 118 1270 212 1455 276 S 1600 365 1715 470" dur="4.7s" begin="-1.1s" rotate="auto" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.86;1" dur="4.7s" begin="-1.1s" repeatCount="indefinite" />
    <ellipse cx="-25" rx="225" ry="76" fill="url(#pulse)" />
    <ellipse cx="25" rx="100" ry="21" fill="url(#glint)" />
  </g>
  <g>
    <animateMotion path="M 1215 -50 C 1325 39 1403 98 1495 111 S 1627 177 1730 302" dur="4.1s" begin="-2.9s" rotate="auto" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.86;1" dur="4.1s" begin="-2.9s" repeatCount="indefinite" />
    <ellipse cx="-25" rx="182" ry="76" fill="url(#pulse)" />
    <ellipse cx="25" rx="100" ry="21" fill="url(#glint)" />
  </g>
  <g>
    <animateMotion path="M 970 967 C 1160 928 1340 824 1481 791 S 1649 678 1730 642" dur="5.3s" begin="-3.6s" rotate="auto" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.86;1" dur="5.3s" begin="-3.6s" repeatCount="indefinite" />
    <ellipse cx="-25" rx="229" ry="94" fill="url(#pulse)" />
    <ellipse cx="25" rx="100" ry="21" fill="url(#glint)" />
  </g>
  <g>
    <animateMotion path="M 1040 827 C 1230 764 1451 679 1560 571 S 1669 459 1712 412" dur="4.9s" begin="-5.1s" rotate="auto" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.86;1" dur="4.9s" begin="-5.1s" repeatCount="indefinite" />
    <ellipse cx="-25" rx="205" ry="72" fill="url(#pulse)" />
    <ellipse cx="25" rx="100" ry="21" fill="url(#glint)" />
  </g>
</svg>
